#rocos-dualarm-proposal { color-scheme: light dark; }
#rocos-dualarm-proposal .rc-app { --rc-ground:light-dark(#f3f5f8,#171819); --rc-paper:light-dark(#ffffff,#202122); --rc-raised:light-dark(#f7f8fa,#28292a); --rc-ink:light-dark(#202938,#f0f1f3); --rc-muted:light-dark(#596574,#adb5be); --rc-line:light-dark(#e2e6eb,#393b3e); --rc-control:light-dark(#bdc5cf,#666c74); --rc-blue:light-dark(#2563eb,#83acff); --rc-right:light-dark(#127b77,#65c9bf); --rc-red:light-dark(#b4232b,#ff959c); --rc-green:light-dark(#237243,#88cba0); --rc-font:'AlibabaPuHuiTi','Noto Sans SC',system-ui,sans-serif; color:var(--rc-ink); background:var(--rc-ground); font:14px/1.5 var(--rc-font); border-radius:12px; overflow:hidden; display:grid; grid-template-columns:112px minmax(0,1fr); min-height:750px; }
#rocos-dualarm-proposal .rc-app *,#rocos-dualarm-proposal .rc-app *::before,#rocos-dualarm-proposal .rc-app *::after { box-sizing:border-box; }
#rocos-dualarm-proposal h1,#rocos-dualarm-proposal h2,#rocos-dualarm-proposal h3,#rocos-dualarm-proposal p { margin:0; }
#rocos-dualarm-proposal h1 { font-size:20px; font-weight:500; }
#rocos-dualarm-proposal h2 { font-size:16px; font-weight:500; }
#rocos-dualarm-proposal h3 { font-size:14px; font-weight:500; }
#rocos-dualarm-proposal button,#rocos-dualarm-proposal input,#rocos-dualarm-proposal select { font:inherit; }
#rocos-dualarm-proposal button { min-height:34px; padding:6px 10px; color:var(--rc-ink); background:var(--rc-paper); border:1px solid var(--rc-control); border-radius:6px; white-space:nowrap; }
#rocos-dualarm-proposal button:hover:not(:disabled) { background:var(--rc-raised); border-color:var(--rc-ink); }
#rocos-dualarm-proposal button:focus-visible,#rocos-dualarm-proposal input:focus-visible,#rocos-dualarm-proposal select:focus-visible { outline:2px solid var(--rc-blue); outline-offset:2px; }
#rocos-dualarm-proposal button:disabled { color:var(--rc-muted); background:var(--rc-raised); border-color:var(--rc-line); cursor:not-allowed; }
#rocos-dualarm-proposal button.rc-primary:not(:disabled) { background:var(--rc-ink); color:var(--rc-paper); border-color:var(--rc-ink); }
#rocos-dualarm-proposal button.rc-stop:not(:disabled) { color:var(--rc-red); border-color:var(--rc-red); }
#rocos-dualarm-proposal input { width:100%; min-width:0; height:28px; text-align:right; padding:2px 7px; color:var(--rc-ink); background:var(--rc-paper); border:1px solid var(--rc-control); border-radius:4px; font-variant-numeric:tabular-nums; }
#rocos-dualarm-proposal input:disabled { color:var(--rc-muted); background:var(--rc-raised); border-color:var(--rc-line); }
#rocos-dualarm-proposal .rc-muted { color:var(--rc-muted); }
#rocos-dualarm-proposal .rc-small { font-size:13px; }
#rocos-dualarm-proposal .rc-num { font-variant-numeric:tabular-nums; }
#rocos-dualarm-proposal .rc-row { display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
#rocos-dualarm-proposal .rc-rail { padding:19px 12px; display:flex; flex-direction:column; gap:28px; }
#rocos-dualarm-proposal .rc-brand { font-size:20px; font-weight:500; letter-spacing:-.6px; }
#rocos-dualarm-proposal .rc-brand span { color:var(--rc-blue); }
#rocos-dualarm-proposal .rc-rail nav { display:grid; gap:8px; }
#rocos-dualarm-proposal .rc-rail nav button { text-align:left; border:0; background:transparent; padding:9px 6px; font-size:13px; }
#rocos-dualarm-proposal .rc-rail nav button[aria-current] { background:var(--rc-line); }
#rocos-dualarm-proposal .rc-rail-bottom { margin-top:auto; font-size:13px; color:var(--rc-muted); }
#rocos-dualarm-proposal .rc-main { min-width:0; padding:0 8px 8px 0; }
#rocos-dualarm-proposal .rc-top { min-height:64px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
#rocos-dualarm-proposal .rc-demo { border:1px solid var(--rc-control); padding:3px 8px; border-radius:4px; font-size:13px; }
#rocos-dualarm-proposal .rc-sheet { background:var(--rc-paper); border:1px solid var(--rc-line); border-radius:12px; padding:20px; }
#rocos-dualarm-proposal .rc-heading { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
#rocos-dualarm-proposal .rc-heading p { color:var(--rc-muted); font-size:13px; margin-top:3px; }
#rocos-dualarm-proposal .rc-id { display:inline-flex; align-items:center; gap:7px; }
#rocos-dualarm-proposal .rc-id::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--rc-blue); }
#rocos-dualarm-proposal .rc-id.right::before { background:var(--rc-right); }
#rocos-dualarm-proposal .rc-statusbar { display:grid; grid-template-columns:1fr 1fr; border-block:1px solid var(--rc-line); margin-bottom:20px; }
#rocos-dualarm-proposal .rc-arm-status { padding:12px 0; display:flex; align-items:center; justify-content:space-between; gap:8px; }
#rocos-dualarm-proposal .rc-arm-status:first-child { padding-right:16px; border-right:1px solid var(--rc-line); }
#rocos-dualarm-proposal .rc-arm-status:last-child { padding-left:16px; }
#rocos-dualarm-proposal .rc-arm-status p { margin-top:3px; color:var(--rc-muted); font-size:13px; }
#rocos-dualarm-proposal .rc-status { color:var(--rc-green); font-size:13px; }
/* 1440px: 112 rail + 8 inset + 40 padding + 2*248 editors + 2*16 gaps + 750 scene = 1438 plus 2 sheet borders. */
#rocos-dualarm-proposal .rc-work { display:grid; grid-template-columns:minmax(212px,248px) minmax(180px,1fr) minmax(212px,248px); gap:16px; align-items:start; }
#rocos-dualarm-proposal .rc-editor { min-width:0; }
#rocos-dualarm-proposal .rc-editor-head { padding-bottom:10px; border-bottom:1px solid var(--rc-line); margin-bottom:10px; }
#rocos-dualarm-proposal .rc-lease { display:flex; align-items:center; justify-content:space-between; gap:4px; margin:10px 0; font-size:13px; }
#rocos-dualarm-proposal .rc-lease button { min-height:30px; padding:3px 7px; font-size:13px; }
#rocos-dualarm-proposal .rc-reason { min-height:38px; display:flex; align-items:center; background:var(--rc-raised); border-radius:4px; padding:7px 9px; font-size:13px; color:var(--rc-muted); margin-bottom:10px; }
#rocos-dualarm-proposal table { border-collapse:collapse; width:100%; table-layout:fixed; }
#rocos-dualarm-proposal th { color:var(--rc-muted); font-size:13px; font-weight:400; padding:5px 0 7px; text-align:right; }
#rocos-dualarm-proposal th:first-child { width:33px; text-align:left; }
#rocos-dualarm-proposal td { padding:2px 0; height:32px; border-bottom:1px solid var(--rc-line); text-align:right; font-variant-numeric:tabular-nums; }
#rocos-dualarm-proposal td:first-child { text-align:left; font-size:13px; }
#rocos-dualarm-proposal td:last-child { padding-left:12px; }

#rocos-dualarm-proposal .rc-params label { display:grid; gap:5px; font-size:13px; color:var(--rc-muted); }
#rocos-dualarm-proposal .rc-params label span { font-size:11px; }

#rocos-dualarm-proposal .rc-scene svg { display:block; width:100%; height:340px; }
#rocos-dualarm-proposal .rc-scene-labels { display:flex; justify-content:space-between; padding:0 16px 12px; gap:10px; font-size:13px; }
#rocos-dualarm-proposal .rc-scene-foot { padding:14px; border-top:1px solid var(--rc-line); font-size:13px; color:var(--rc-muted); }
#rocos-dualarm-proposal .rc-events { margin-top:18px; border-top:1px solid var(--rc-line); padding-top:12px; }
#rocos-dualarm-proposal .rc-events .rc-event { display:grid; grid-template-columns:70px 40px 1fr; gap:10px; margin-top:8px; font-size:13px; }
#rocos-dualarm-proposal .rc-foot { margin-top:13px; display:flex; gap:8px; justify-content:space-between; flex-wrap:wrap; font-size:13px; color:var(--rc-muted); }
#rocos-dualarm-proposal .rc-focus .rc-work { grid-template-columns:minmax(220px,1fr) 320px; }
#rocos-dualarm-proposal .rc-focus .rc-scene svg { height:390px; }
#rocos-dualarm-proposal .rc-focus .rc-switch { display:flex; gap:8px; margin-bottom:12px; }
#rocos-dualarm-proposal .rc-switch button { flex:1; }
#rocos-dualarm-proposal .rc-switch button[aria-pressed=true] { background:var(--rc-ink); color:var(--rc-paper); border-color:var(--rc-ink); }
#rocos-dualarm-proposal .rc-mobile-switch { display:none; }
#rocos-dualarm-proposal .rc-center { min-width:0; }
#rocos-dualarm-proposal .rc-error { color:var(--rc-red); }
#rocos-dualarm-proposal .rc-dialog { background:var(--rc-paper); color:var(--rc-ink); border:1px solid var(--rc-control); border-radius:12px; padding:22px; max-width:min(500px,90%); }
#rocos-dualarm-proposal .rc-dialog p { margin:12px 0; }
@media(max-width:1150px) { #rocos-dualarm-proposal .rc-app { grid-template-columns:1fr; } #rocos-dualarm-proposal .rc-rail { padding:12px 18px; flex-direction:row; align-items:center; justify-content:space-between; gap:12px; } #rocos-dualarm-proposal .rc-rail nav { display:flex; gap:8px; } #rocos-dualarm-proposal .rc-rail-bottom { display:none; } #rocos-dualarm-proposal .rc-top { min-height:40px; padding-top:0; } #rocos-dualarm-proposal .rc-main { padding:0 8px 8px; } }
@media(max-width:850px) { #rocos-dualarm-proposal .rc-work { grid-template-columns:1fr 1fr; } #rocos-dualarm-proposal .rc-work>.rc-center { grid-column:1/-1; grid-row:1; } #rocos-dualarm-proposal .rc-scene svg { height:220px; } #rocos-dualarm-proposal .rc-focus .rc-work { grid-template-columns:1fr 1fr; } #rocos-dualarm-proposal .rc-focus .rc-work>.rc-center { grid-column:1; grid-row:auto; } #rocos-dualarm-proposal .rc-focus .rc-scene svg { height:380px; } }
@media(max-width:600px) { #rocos-dualarm-proposal .rc-sheet { padding:14px; } #rocos-dualarm-proposal .rc-rail { flex-wrap:wrap; } #rocos-dualarm-proposal .rc-rail nav button { min-height:40px; } #rocos-dualarm-proposal .rc-statusbar { grid-template-columns:1fr; } #rocos-dualarm-proposal .rc-arm-status:first-child { border-right:0; border-bottom:1px solid var(--rc-line); padding-right:0; } #rocos-dualarm-proposal .rc-arm-status:last-child { padding-left:0; } #rocos-dualarm-proposal .rc-work,#rocos-dualarm-proposal .rc-focus .rc-work { grid-template-columns:1fr; } #rocos-dualarm-proposal .rc-work>.rc-scene { grid-column:1; } #rocos-dualarm-proposal .rc-focus .rc-scene svg { height:220px; } #rocos-dualarm-proposal .rc-mobile-switch { display:flex; gap:8px; margin:10px 0; } #rocos-dualarm-proposal .rc-mobile-switch button { flex:1; } #rocos-dualarm-proposal .rc-editor[data-mobile-hidden=true] { display:none; } #rocos-dualarm-proposal .rc-app { min-height:750px; } #rocos-dualarm-proposal button { min-height:44px; } #rocos-dualarm-proposal input { height:40px; font-size:16px; } #rocos-dualarm-proposal .rc-params input { height:40px; } }
/* A shared responsive stage keeps variant navigation in the same place. */
#rocos-dualarm-proposal .rc-app { min-height:960px; }
@media(max-width:1150px) { #rocos-dualarm-proposal .rc-app { min-height:1010px; } }
@media(max-width:850px) { #rocos-dualarm-proposal .rc-app { min-height:1450px; } }
@media(max-width:600px) { #rocos-dualarm-proposal .rc-app { min-height:1700px; } }
@media(max-width:360px) { #rocos-dualarm-proposal .rc-app { min-height:1900px; } }
</style>
<div id="rocos-dualarm-proposal">
  <div class="viz-carousel" aria-label="双臂上位机页面预案" data-previous-label="上一个预案" data-next-label="下一个预案">
    <section data-variant="双臂并排工作台" aria-label="双臂并排工作台"><div class="rc-app" data-layout="parallel"></div></section>
    <section data-variant="单臂聚焦工作台" aria-label="单臂聚焦工作台" hidden><div class="rc-app rc-focus" data-layout="focus"></div></section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('rocos-dualarm-proposal');
  const names = {left:'左臂',right:'右臂'};
  const initial = {left:[2,-3,1,-4,3,0,2],right:[-2,3,-1,4,-3,0,-2]};
  const targets = {left:[8,-9,6,-12,7,2,5],right:[-7,8,-6,10,-7,-2,-5]};
  const scene = () => `<section class="rc-scene" aria-label="双臂共用场景结构示意">
    <div class="rc-scene-head"><h2>共用场景</h2><span class="rc-small rc-muted">结构示意 · 非实时模型</span></div>
    <svg viewBox="0 0 400 350" role="img" aria-label="左蓝右青的两条七轴运动链，共用一个基座">
      <g stroke="var(--rc-line)" stroke-width="1" fill="none"><path d="M15 285L200 215L385 285L200 345Z M60 268L245 328 M105 251L290 311 M150 234L335 294 M60 302L245 232 M105 319L290 249 M150 336L335 266"/></g>
      <path d="M162 256L200 242L238 256L200 270Z" fill="var(--rc-paper)" stroke="var(--rc-control)"/><path d="M162 256V274L200 289L238 274V256L200 270Z" fill="var(--rc-line)" stroke="var(--rc-control)"/>
      <path d="M183 257V160H217V257L200 264Z" fill="var(--rc-paper)" stroke="var(--rc-control)" stroke-width="2"/>
      <g data-chain="left" fill="var(--rc-paper)" stroke="var(--rc-blue)" stroke-width="3"><path d="M185 166L150 147L109 157L84 113L65 151L93 187L77 215" fill="none" stroke="var(--rc-control)" stroke-width="17" stroke-linejoin="round" stroke-linecap="round"/><path d="M185 166L150 147L109 157L84 113L65 151L93 187L77 215" fill="none" stroke="var(--rc-paper)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="185" cy="166" r="8"/><circle cx="150" cy="147" r="8"/><circle cx="109" cy="157" r="8"/><circle cx="84" cy="113" r="8"/><circle cx="65" cy="151" r="7"/><circle cx="93" cy="187" r="7"/><circle cx="77" cy="215" r="6"/></g>
      <g data-chain="right" fill="var(--rc-paper)" stroke="var(--rc-right)" stroke-width="3"><path d="M215 166L250 147L290 156L318 118L339 151L310 189L328 218" fill="none" stroke="var(--rc-control)" stroke-width="17" stroke-linejoin="round" stroke-linecap="round"/><path d="M215 166L250 147L290 156L318 118L339 151L310 189L328 218" fill="none" stroke="var(--rc-paper)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="215" cy="166" r="8"/><circle cx="250" cy="147" r="8"/><circle cx="290" cy="156" r="8"/><circle cx="318" cy="118" r="8"/><circle cx="339" cy="151" r="7"/><circle cx="310" cy="189" r="7"/><circle cx="328" cy="218" r="6"/></g>
      <g fill="var(--rc-muted)" font-size="13"><text x="52" y="245">L · 左臂</text><text x="302" y="247">R · 右臂</text><text x="179" y="315">基座</text></g>
    </svg>
    <div class="rc-scene-labels"><span class="rc-id">左臂 <span data-scene-state="left"></span></span><span class="rc-id right">右臂 <span data-scene-state="right"></span></span></div>
    <div class="rc-scene-foot">两臂各自执行。视角共用，控制权与运动指令分别管理。</div>
  </section>`;
  const editor = side => `<section class="rc-editor" data-arm="${side}" aria-label="${names[side]}控制面板">
    <div class="rc-editor-head rc-row"><h2 class="rc-id ${side}">${names[side]}控制</h2><span class="rc-small rc-muted">7 轴 · ${side === 'left'?'L':'R'}</span></div>
    <div class="rc-lease"><span data-owner="${side}"></span><button data-action="lease" data-side="${side}"></button></div>
    <div class="rc-reason" data-reason="${side}"></div>
    <div class="rc-row"><h3>关节目标</h3><span class="rc-small rc-muted">角度 °</span></div>
    <table aria-label="${names[side]}关节实际与目标角度"><thead><tr><th>关节</th><th>实际 °</th><th>目标 °</th></tr></thead><tbody>${initial[side].map((q,i)=>`<tr><td>J${i+1}</td><td data-feedback="${side}-${i}">${q.toFixed(2)}</td><td><input type="number" step="0.1" min="-90" max="90" value="${targets[side][i]}" data-joint="${i}" data-side="${side}" aria-label="${names[side]} J${i+1} 目标角度" /></td></tr>`).join('')}</tbody></table>
    <div class="rc-params"><label>速度<span>rad/s</span><input type="number" min="0.01" max="1" step="0.01" value="0.10" data-param="velocity" data-side="${side}" aria-label="${names[side]}速度" /></label><label>加速度<span>rad/s²</span><input type="number" min="0.01" max="2" step="0.01" value="0.30" data-param="acceleration" data-side="${side}" aria-label="${names[side]}加速度" /></label><label>加加速度<span>rad/s³</span><input type="number" min="0.1" max="10" step="0.1" value="5.0" data-param="jerk" data-side="${side}" aria-label="${names[side]}加加速度" /></label></div>
    <div class="rc-actions"><button class="rc-primary" data-action="move" data-side="${side}">下发${names[side]} MoveJ</button><div class="rc-row"><button data-action="enable" data-side="${side}"></button><button data-action="pause" data-side="${side}">暂停${names[side]}</button></div></div>
  </section>`;
  root.querySelectorAll('.rc-app').forEach((app, variantIndex) => {
    const focus = app.dataset.layout === 'focus';
    const model = {left:{owned:true,enabled:true,online:true,state:'STOPPED',q:[...initial.left],target:[...targets.left]},right:{owned:false,enabled:false,online:true,state:'IDLE',q:[...initial.right],target:[...targets.right]}};
    const design = {selected:'left',scenario:'正常',scene:true};
    const events = [{side:'左臂',message:'已使能，等待关节运动指令',time:'预案'},{side:'右臂',message:'控制权空闲，可单独申请',time:'预案'}];
    app.innerHTML = `<aside class="rc-rail"><div class="rc-brand"><span>R</span>OCOS<div class="rc-small rc-muted">双臂工作站</div></div><nav aria-label="工作区"><button aria-current="page" data-nav="control">双臂控制</button><button data-nav="model">设备模型</button><button data-nav="logs">操作记录</button></nav><div class="rc-rail-bottom">独立执行<br>左臂 / 右臂</div></aside><div class="rc-main"><header class="rc-top"><span class="rc-small">工作站 / MuJoCo 双臂</span><span class="rc-demo">交互预案 · 示例数据</span></header><main class="rc-sheet"><div class="rc-heading"><div><h1>双臂控制</h1><p>${focus?'集中编辑一臂，持续观察两臂。':'左右独立操作，共用一个工作场景。'}</p></div><span class="rc-small rc-muted">${focus?'聚焦布局':'并排布局 · 推荐'}</span></div><div class="rc-statusbar">${['left','right'].map(s=>`<div class="rc-arm-status"><div><span class="rc-id ${s}">${names[s]}</span> <span class="rc-status" data-status="${s}"></span><p data-summary="${s}"></p></div><button class="rc-stop" data-action="stop" data-side="${s}">停止${names[s]}</button></div>`).join('')}</div>${!focus?'<div class="rc-mobile-switch rc-switch"><button data-select="left" aria-pressed="true">编辑左臂</button><button data-select="right" aria-pressed="false">编辑右臂</button></div>':''}<div class="rc-work">${focus?`${scene()}<div><div class="rc-switch"><button data-select="left" aria-pressed="true">编辑左臂</button><button data-select="right" aria-pressed="false">编辑右臂</button></div>${editor('left')}${editor('right')}</div>`:`${editor('left')}${scene()}${editor('right')}`}</div><section class="rc-events" aria-label="按臂操作记录"><div class="rc-row"><h3>操作记录</h3><span class="rc-small rc-muted">按臂标记 · 最新 2 条</span></div><div data-events aria-live="polite"></div></section><footer class="rc-foot"><span>示例运行：所有操作仅改变本预案</span><span>软件停止 · 非急停</span></footer></main></div><dialog class="rc-dialog"><h2 data-dialog-title></h2><div data-dialog-body></div><button data-close>关闭</button></dialog>`;
    const center=document.createElement('div');center.className='rc-center';
    const sceneElement=app.querySelector('.rc-scene');sceneElement.before(center);
    center.append(sceneElement,app.querySelector('.rc-events'));
    let lastEvents='';
    function log(side,message) { events.unshift({side:names[side],message,time:new Date().toLocaleTimeString('zh-CN',{hour12:false})}); events.splice(6); }
    function update() {
      ['left','right'].forEach(side=>{
        const arm=model[side], moving=['RUNNING','PAUSED'].includes(arm.state);
        const status = !arm.online?'状态失联':arm.state==='RUNNING'?'运动中':arm.state==='PAUSED'?'已暂停':arm.enabled?'就绪':'未使能';
        app.querySelector(`[data-status="${side}"]`).textContent=status;
        app.querySelector(`[data-status="${side}"]`).style.color=!arm.online?'var(--rc-red)':arm.enabled?'var(--rc-green)':'var(--rc-muted)';
        app.querySelector(`[data-summary="${side}"]`).textContent=`${!arm.online?'反馈过期':arm.owned?'本会话持有控制权':'只读 · 无控制权'} · ${arm.online?arm.state:'—'}`;
        app.querySelector(`[data-scene-state="${side}"]`).textContent=status;
        app.querySelector(`[data-owner="${side}"]`).textContent=arm.owned?'控制权：本会话':'控制权：未持有';
        app.querySelector(`[data-reason="${side}"]`).textContent=!arm.online?'反馈过期；禁止新运动，不自动恢复执行':!arm.owned?'先申请本臂控制权，再使能与下发运动':!arm.enabled?'已取得控制权，可使能本臂':moving?`${status} · 另一臂可继续独立操作`:'反馈已稳定，可下发本臂 MoveJ';
        app.querySelectorAll(`[data-action][data-side="${side}"]`).forEach(b=>{
          const action=b.dataset.action;
          if(action==='lease') {b.textContent=arm.owned?'释放控制权':'申请控制权';b.disabled=!arm.online||moving;}
          if(action==='enable') {b.textContent=arm.enabled?`下使能${names[side]}`:`使能${names[side]}`;b.disabled=!arm.online||!arm.owned||moving;}
          if(action==='move') b.disabled=!arm.online||!arm.owned||!arm.enabled||moving;
          if(action==='pause') {b.textContent=arm.state==='PAUSED'?`恢复${names[side]}`:`暂停${names[side]}`;b.disabled=!arm.online||!arm.owned||!moving;}
          if(action==='stop') b.disabled=!arm.owned||(!moving&&arm.online);
        });
        app.querySelectorAll(`input[data-side="${side}"]`).forEach(input=>input.disabled=!arm.online||!arm.owned||moving);
        arm.q.forEach((q,i)=>app.querySelector(`[data-feedback="${side}-${i}"]`).textContent=arm.online?q.toFixed(2):'—');
        const panel=app.querySelector(`[data-arm="${side}"]`);
        panel.hidden=focus&&design.selected!==side;
        panel.dataset.mobileHidden=String(!focus&&design.selected!==side);
        const chain=app.querySelector(`[data-chain="${side}"]`);
        chain.style.opacity=arm.online?'1':'.35';
      });
      app.querySelectorAll('[data-select]').forEach(b=>b.setAttribute('aria-pressed',String(design.selected===b.dataset.select)));
      app.querySelector('.rc-scene').hidden=!design.scene;
      const eventKey=JSON.stringify(events.slice(0,2));if(eventKey===lastEvents)return;lastEvents=eventKey;
      const logRoot=app.querySelector('[data-events]');logRoot.replaceChildren();
      events.slice(0,2).forEach(e=>{const row=document.createElement('div');row.className='rc-event';[e.time,e.side,e.message].forEach((text,i)=>{const span=document.createElement('span');span.textContent=text;if(i===0)span.className='rc-muted rc-num';row.append(span);});logRoot.append(row);});
    }
    app.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.select){design.selected=b.dataset.select;update();return;}
      const dialog=app.querySelector('dialog');
      if(b.hasAttribute('data-close')){dialog.close();return;}
      if(b.dataset.nav){
        if(b.dataset.nav==='control')return;
        app.querySelector('[data-dialog-title]').textContent=b.dataset.nav==='model'?'双臂设备模型':'操作记录';
        const content=app.querySelector('[data-dialog-body]');content.replaceChildren();
        const texts=b.dataset.nav==='model'?['左臂：主站 0，Left_Joint1–7。右臂：主站 1，Right_Joint1–7。','两条运动链置于同一 URDF 场景；界面中的左右按机器人配置命名，与相机方向无关。','首版通过本地模型包加载。双臂服务尚未提供 URDF / mesh 下载接口。']:events.map(x=>`${x.time} · ${x.side} · ${x.message}`);
        texts.forEach(t=>{const p=document.createElement('p');p.textContent=t;content.append(p);});dialog.showModal();return;
      }
      const side=b.dataset.side;if(!side)return;const arm=model[side];
      switch(b.dataset.action){
        case 'lease':arm.owned=!arm.owned;log(side,arm.owned?'已取得本臂控制权':'已释放本臂控制权');break;
        case 'enable':arm.enabled=!arm.enabled;arm.state=arm.enabled?'STOPPED':'IDLE';log(side,arm.enabled?'使能完成，示例反馈已稳定':'已下使能');break;
        case 'move':{
          const inputs=[...app.querySelectorAll(`input[data-side="${side}"]`)];
          if(!inputs.every(x=>x.value!==''&&x.checkValidity())){log(side,'参数无效：请检查目标角度及正数运动参数');update();return;}
          arm.target=[...app.querySelectorAll(`input[data-joint][data-side="${side}"]`)].map(x=>Number(x.value));
          arm.start=[...arm.q];arm.step=0;arm.state='RUNNING';log(side,'MoveJ 已受理，等待本臂反馈完成');break;
        }
        case 'pause':arm.state=arm.state==='PAUSED'?'RUNNING':'PAUSED';log(side,arm.state==='PAUSED'?'本臂已暂停':'本臂已恢复');break;
        case 'stop':if(!arm.online){log(side,'停止请求结果未知；保持失联提示');break;}arm.state='STOPPED';log(side,'本臂已停止，另一臂继续原状态');break;
      }
      update();
    });
    update();
    const timer=setInterval(()=>{
      if(!root.isConnected){clearInterval(timer);return;}
      let changed=false;
      ['left','right'].forEach(side=>{const a=model[side];if(a.state==='RUNNING'&&a.online){a.step=Math.min(1,a.step+.025);const t=a.step*a.step*(3-2*a.step);a.q=a.start.map((q,i)=>q+(a.target[i]-q)*t);if(a.step===1){a.state='STOPPED';log(side,'示例运动完成，关节已到达目标');}changed=true;}});
      if(changed)update();
    },150);
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{
      const a=model.right;
      a.online=design.scenario!=='右臂失联';
      if(design.scenario==='右臂租约失效'){a.owned=false;log('right','本臂租约已失效；不会影响左臂控制权');}
      update();
    }});tweak.addSelect(design,'scenario',{label:'异常状态预演',options:['正常','右臂失联','右臂租约失效']});}
  });
})();
</script>
